mutation gateManagementChangeStatus(
    $gateApprovalId: Int!
    $gateApprovalStatus: GateApprovalStatus!
) {
    gateApproval_changeApprovalStatus(
        gateApprovalId: $gateApprovalId
        gateApprovalStatus: $gateApprovalStatus
    ) {
        status
    }
}

