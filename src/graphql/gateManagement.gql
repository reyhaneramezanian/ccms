query gateManagementGet(
    $skip: Int
    $take: Int
    $where: GateApprovalFilterInput
    $order: [GateApprovalSortInput!]
) {
    gateApproval_getGateApprovals {
        result(skip: $skip, take: $take, where: $where, order: $order) {
            totalCount
            items {
                id
                gateApprovalMode
                gateApprovalType
                approvalStatus
                start
                end
                securityCode
                residentFlat {
                    resident {
                        firstName
                        lastName
                        phoneNumber
                    }
                    flat {
                        id
                        name
                        floor {
                            id
                            name
                            block {
                                id
                                name
                                complex {
                                    id
                                    name
                                }
                            }
                        }
                    }
                }
            }
        }
        status
    }
}

