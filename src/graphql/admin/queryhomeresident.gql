query payment_getPayments(
    $skip: Int
    $take: Int
    $where: PaymentFilterInput
    $order: [PaymentSortInput!]
) {
    payment_getPayments {
        result(skip: $skip, take: $take, where: $where, order: $order) {
            items {
                amount
                id
                paymentStatus
                dueDate
                createdDate
            }

            totalCount
        }
        status
    }
}
