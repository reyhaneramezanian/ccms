query announcementType_getAnnouncementTypes(
    $skip: Int
    $take: Int
    $where: AnnouncementTypeFilterInput
    $order: [AnnouncementTypeSortInput!]
) {
    announcementType_getAnnouncementTypes {
        result(skip: $skip, take: $take, where: $where, order: $order) {
            items {
                name
                id
                activeStatus
            }
            totalCount
        }
        status
    }
}

mutation announcement_create($input: AnnouncementInput) {
    announcement_create(input: $input) {
        status
    }
}

query serviceType_getServiceTypes($skip: Int, $take: Int, $where: ServiceTypeFilterInput) {
    serviceType_getServiceTypes {
        result(skip: $skip, take: $take, where: $where) {
            items {
                name
                id
            }
            totalCount
        }
        status
    }
}

mutation request_create($input: RequestInput) {
    request_create(input: $input) {
        status
    }
}

