query flat_getAvailableFlats(
    $skip: Int
    $take: Int
    $where: FlatFilterInput
    $order: [FlatSortInput!]
    $ownershipStatus: OwnershipStatus!
    $currentFlatId: Int
) {
    flat_getAvailableFlats(ownershipStatus: $ownershipStatus, currentFlatId: $currentFlatId) {
        result(skip: $skip, take: $take, where: $where, order: $order) {
            items {
