mutation user_createResident($input: ResidentCreateInput, $residentFlatInput: ResidentFlatInput) {
    user_createResident(input: $input, residentFlatInput: $residentFlatInput) {
        result {
            id
        }
        status
    }
}
mutation user_updateResident($input: ResidentUpdateInput) {
    user_updateResident(input: $input) {
        status
    }
}

mutation user_deleteResident($entityId: Int!) {
    user_deleteResident(entityId: $entityId) {
        code
        value
    }
}

mutation user_deleteSecurity($securityId: Int!) {
    user_deleteSecurity(securityId: $securityId) {
        code
        value
    }
}

mutation user_createSecurity($input: SecurityCreateInput) {
