query user_getResidents(
    $skip: Int
    $take: Int
    $where: ResidentFilterInput
    $order: [ResidentSortInput!]
) {
    user_getResidents {
        result(skip: $skip, take: $take, where: $where, order: $order) {
            items {
                firstName
                lastName
                middleName
                id
                email
                phoneNumber
                activeStatus
                dateOfBirth
                alternativeContact
                gender
                photoUrl
                residentFlats {
                    ownershipStatus
                    flatId
                    residentId
                    id
                    flat {
                        name
                        id
                        floor {
                            name
                            id
                            block {
                                name
                                id
                                complex {
                                    name
                                    id
                                }
                            }
                        }
                    }
                }
            }

            totalCount
        }
        status
    }
}

query user_getStaffs($skip: Int, $take: Int, $where: StaffFilterInput, $order: [StaffSortInput!]) {
    user_getStaffs {
        result(skip: $skip, take: $take, where: $where, order: $order) {
            items {
                createdDate
                lastModifiedDate
                staffId
                firstName
                lastName
                phoneNumber
                email
                activeStatus
                id
                middleName
                gender
                dateOfBirth
                dateOfJoining
                alternatePhone
                alternateEmail
                address
                employmentTypeId
                departmentId
                photoUrl
                dateOfTermination
                staffComplexes {
                    complexId
                    complex {
                        name
                    }
                }
                department {
                    name
                    id
                }
                employmentType {
                    name
                    id
                }
                departmentManagers {
                    id
                }
            }

            totalCount
        }
        status
    }
}

query user_getSecurities(
    $skip: Int
    $take: Int
    $where: SecurityFilterInput
    $order: [SecuritySortInput!]
) {
    user_getSecurities {
        result(skip: $skip, take: $take, where: $where, order: $order) {
            items {
